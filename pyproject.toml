[project]
name = "rezonate"
version = "0.1.0"
description = "A personal, audio-first music recommender that learns one listener's taste."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "requests>=2.32",
    "typer>=0.12",
    "click>=8.1",
    "rich>=13.7",
    "mutagen>=1.47",
    "tabulate>=0.9",
]

[project.optional-dependencies]
# Audio embedding models. Kept optional so the data/eval layers can be used
# (and tested) without a multi-GB PyTorch install.
embed = [
    "torch>=2.3",
    "transformers>=4.44,<5",
    "nnAudio>=0.3.3",        # imported by MERT's remote modeling code
    "sentence-transformers>=3.0",  # lyrics embeddings
]
notebook = ["jupyterlab>=4.2", "matplotlib>=3.9"]
dev = ["pytest>=8.2", "ruff>=0.5"]

[project.scripts]
rezonate = "rezonate.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rezonate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B023", "B905", "E501"]  # B023: closures in run_eval bind loop vars via defaults on purpose
